# Model configuration. Every model runs through a local Ollama server.
# Pull the models you need (e.g. `ollama pull qwen3.6:27b`) and start Ollama.
# To use another machine, change base_url.

provider: local

providers:
  local:
    kind: ollama
    base_url: http://127.0.0.1:11434
    timeout_s: 240
    num_ctx: 8192        # Ollama's 4096 default truncates the conversation

defaults:
  temperature: 0.0
  max_retries: 4
  timeout_s: 600

roles:
  # The three evaluated agents (Experiments 1 and 2).
  agent_backend_1:
    think: false
    id: qwen3.6:27b
  agent_backend_2:
    think: false
    id: mistral-small3.2:24b
  agent_backend_3:
    think: false
    id: nemotron3:33b

  # Experiment 2 scoring: which listed attributes a reply states, and quality 1-5.
  extraction:
    id: deepseek-r1:32b
  judge:
    think: true
    id: deepseek-r1:32b

capabilities:
  local:
    json_mode: true
    constrained_decoding: true
    seed: true
    logprobs: false
    prefix_caching: true
